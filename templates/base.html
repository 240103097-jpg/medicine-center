<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Medicine Center{% endblock %}</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: #183247; background: #f3f7fa; }
header, main { width: min(100% - 2rem, 48rem); margin: 2rem auto; } nav { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; } a { color: #075b91; }
main { background: white; padding: clamp(1rem, 4vw, 2rem); border-radius: .75rem; } h1 { line-height: 1.2; } form p { margin: 1.2rem 0; }
label { display: block; font-weight: 600; } input { width: 100%; padding: .7rem; font: inherit; border: 1px solid #688295; border-radius: .3rem; }
button { padding: .7rem 1.2rem; background: #075b91; color: white; border: 0; border-radius: .3rem; font: inherit; cursor: pointer; }
.helptext { display: block; font-size: .9rem; } .errorlist { color: #a11b25; } .messages { padding: 1rem; background: #e7f4ee; } li { overflow-wrap: anywhere; }
header, main { overflow-wrap: anywhere; } .doctor-description { white-space: pre-wrap; }
.doctor-list { padding-left: 1.5rem; } nav form { margin: 0; } :focus-visible { outline: 3px solid #d18200; outline-offset: 3px; }
</style>
</head>
<body>
<header><nav aria-label="Main navigation"><a href="{% url 'home' %}">Medicine Center</a>
<a href="{% url 'doctor_list' %}">Doctors</a>
{% if user.is_authenticated %}<span>Signed in as {{ user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
{% else %}<a href="{% url 'register' %}">Register</a><a href="{% url 'login' %}">Sign in</a>{% endif %}
</nav></header>
<main>{% if messages %}<ul class="messages" role="status">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main>
</body></html>
